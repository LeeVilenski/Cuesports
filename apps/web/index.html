<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10251b" />
    <meta
      name="description"
      content="Snooker, English pool, 9-ball and 10-ball with realistic ball physics."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cuesports</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="home">
      <header>
        <h1>Cuesports</h1>
        <p class="tag">Snooker, English pool, 9-ball and 10-ball with realistic ball physics.</p>

      <canvas id="demo" aria-label="A 9-ball break simulated by the physics engine"></canvas>
      <p class="caption">

      <section class="status">
        <p>The game is in early development. The physics core is ready to try in the lab.</p>
        <p><a class="button" href="/lab/">Open the physics lab</a></p>
        <p id="offline" class="small" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
